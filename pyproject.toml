# pyproject.toml  — place at repo root
[project]
name = "nhai-face-pipeline"
version = "0.1.0"
description = "Offline facial recognition and liveness detection — Route 2 ONNX"
authors = [{ name = "AkashB-17" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  # Core inference
  "onnxruntime==1.18.1",
  "onnx==1.16.1",

  # Vision & model ops
  "torch==2.3.1",
  "torchvision==0.18.1",
  "opencv-python-headless==4.10.0.84",
  "numpy==1.26.4",
  "Pillow==10.3.0",

  # Compression tools
  "onnxruntime-tools==1.7.0",
  "onnxsim==0.4.36",

  # Geometry / liveness
  "scipy==1.13.1",

  # Data & evaluation
  "scikit-learn==1.5.0",
  "pandas==2.2.2",
  "tqdm==4.66.4",

  # Security (embedding encryption)
  "cryptography==42.0.8",

  # Config management
  "pydantic==2.7.3",
  "pydantic-settings==2.3.3",
  "python-dotenv==1.0.1",

  # Logging & monitoring
  "loguru==0.7.2",

  # Testing
  "pytest==8.2.2",
  "pytest-cov==5.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.4.9",
  "mypy==1.10.0",
  "pre-commit==3.7.1",
  "ipykernel==6.29.5",
  "jupyter==1.0.0",
]
training = [
  "insightface==0.7.3",
  "albumentations==1.4.10",
  "timm==1.0.3",
  "wandb==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["ai_pipeline/tests"]
pythonpath = ["ai_pipeline/src", "ai_pipeline"]
addopts = "--cov=ai_pipeline/src --cov-report=term-missing -v"

[tool.hatch.build.targets.wheel]
packages = ["ai_pipeline/configs"]