[project]
name = "facial-recognition-ml"
version = "0.1.0"
description = "Offline facial recognition and liveness detection — ONNX Route 2"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Name", email = "you@example.com" }]

[project.scripts]
download-weights   = "scripts.download_weights:main"
export-onnx        = "scripts.export_onnx:main"
run-compression    = "scripts.run_compression:main"
benchmark          = "scripts.benchmark:main"

[tool.uv]
dev-dependencies = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "jupyter>=1.0",
  "ipykernel>=6.29",
]

[project.dependencies]
torch            = ">=2.3.0"
torchvision      = ">=0.18.0"
onnx             = ">=1.16"
onnxruntime      = ">=1.18"
onnxruntime-tools= ">=1.7"
opencv-python-headless = ">=4.10"
numpy            = ">=1.26"
Pillow           = ">=10.3"
pycryptodome     = ">=3.20"
sqlalchemy       = ">=2.0"
aiosqlite        = ">=0.20"
pydantic         = ">=2.7"
pydantic-settings= ">=2.2"
loguru           = ">=0.7"
rich             = ">=13.7"
typer            = ">=0.12"
boto3            = ">=1.34"
httpx            = ">=0.27"
tqdm             = ">=4.66"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--cov=src --cov-report=term-missing -v"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
