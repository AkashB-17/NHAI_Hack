name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint with Ruff
        run: uv run ruff check ai_pipeline/

      - name: Type check with mypy
        run: uv run mypy ai_pipeline/src/ --ignore-missing-imports

      - name: Run tests
        run: uv run pytest -v --cov=ai_pipeline/src
